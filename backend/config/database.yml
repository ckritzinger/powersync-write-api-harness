# Built from the write API's DATABASE_TYPE / DATABASE_URI (see lib/source_database.rb).
# Unused when DATABASE_TYPE=mongodb (ActiveRecord is not loaded).
<% unless SourceDatabase.mongodb? %>
default: &default
  url: <%= SourceDatabase.active_record_url %>
  pool: 5
<% if SourceDatabase.type == "mssql" %>
  # sp_cdc_enable_table creates capture jobs and can exceed TinyTDS's short default statement timeout.
  timeout: 300000
<% end %>

development:
  <<: *default
production:
  <<: *default
<% end %>
